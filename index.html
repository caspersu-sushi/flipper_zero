<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Casper's Lab</title>
    <style>
        body { background-color: #121212; color: #00ff00; font-family: 'Courier New', monospace; padding: 50px; }
        .console { border: 1px solid #00ff00; padding: 20px; box-shadow: 0 0 15px #00ff00; min-height: 200px; }
        
        /* 游標閃爍效果 */
        .cursor { display: inline-block; width: 10px; background-color: #00ff00; margin-left: 5px; animation: blink 0.7s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; color: #00ff00; border: 1px solid #00ff00; text-decoration: none; transition: 0.3s; opacity: 0; }
        .show-btn { opacity: 1; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="console">
        <h1 id="typewriter"></h1><span class="cursor">&nbsp;</span>
        <div id="sub-text"></div>
        <a href="projects.html" id="myBtn" class="btn">進入專案列表</a>
    </div>

    <div id="schematic" style="margin-top: 40px; text-align: center; opacity: 0; transition: opacity 2s ease-in-out;">
        <p style="color: #00ff00; font-size: 12px; letter-spacing: 2px;">[ HARDWARE_SCHEMATIC_v1.0 ]</p>
        <img src="https://images.prismic.io/flipper-zero/36021644-2458-4796-bc94-df9b4185121b_flipper-zero-render.png" 
             style="max-width: 80%; width: 300px; opacity: 0.7; filter: grayscale(100%) sepia(100%) hue-rotate(80deg);">
    </div>

    <script>
        const titleText = "> CASPER_FLIPPER_ZERO_PROJECT";
        const subText = "狀態：系統運作中...\n目前進度：已成功連結 DNS 與 GitHub Repository。";
        
        let i = 0;
        let j = 0;

        function typeTitle() {
            if (i < titleText.length) {
                document.getElementById("typewriter").innerHTML += titleText.charAt(i);
                i++;
                setTimeout(typeTitle, 100);
            } else {
                typeSubText();
            }
        }

        function typeSubText() {
            if (j < subText.length) {
                if (subText.charAt(j) === "\n") {
                    document.getElementById("sub-text").innerHTML += "<br>";
                } else {
                    document.getElementById("sub-text").innerHTML += subText.charAt(j);
                }
                j++;
                setTimeout(typeSubText, 50);
            } else {
                // 文字打完後，顯示按鈕
                document.getElementById("myBtn").classList.add("show-btn");
                // 同時讓底部的圖片優雅地浮現
                document.getElementById("schematic").style.opacity = "0.7";
            }
        }

        window.onload = typeTitle;
    </script>
</body>
</html>
